services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happytorch
      POSTGRES_USER: happytorch
      POSTGRES_PASSWORD: happytorch_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happytorch"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: happytorch
      DB_PASSWORD: happytorch_dev
      DB_NAME: happytorch
      DB_SSLMODE: disable
      JWT_SECRET: dev-secret-change-in-production
      JUDGE_URL: http://judge:9000
      FRONT_URL: http://localhost:3000
      REDIS_URL: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  judge:
    build: ./judge
    ports:
      - "9000:9000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  pgdata:
